# Il sito su GitHub Pages: il giro di ogni giorno feriale e ogni push su main.
#
# - Giro del giorno (orario, o lanciato a mano): riscarica dal sito il
#   catalogo di ieri, che è la memoria dello scaricamento (dati di emissione,
#   piani degli step-up, documenti del MEF già letti), scarica i dati di
#   oggi, compila e pubblica. Se i listini non si leggono, lo scaricamento
#   esce con 1: il sito resta quello di ieri e GitHub lo segnala per email.
#   Il rinnovo dei dati non tocca il codice e non chiede conferma. Gli
#   orari sono due: il secondo è di riserva e non rifà il giro se il primo
#   ha già pubblicato i prezzi di oggi.
# - Push su main: test, poi ricompila col catalogo già pubblicato, senza
#   riscaricare niente.
# - Primo giro, quando il sito non c'è ancora: a mano, con «da zero» e
#   onvista a 700, per avere subito i dati di emissione.
# - A mano si può anche ripartire dal catalogo di un giro passato
#   (`catalogo_da_giro`), finché GitHub ne tiene il pacchetto.
#
# Su una repo pubblica GitHub sospende gli orari dopo 60 giorni senza
# attività nella repo: il giro quotidiano non fa commit, quindi va
# riattivato dalla scheda Actions se in due mesi non si tocca il codice.

name: sito

on:
  schedule:
    # 17:17 UTC: le 18:17 in inverno e le 19:17 d'estate a Roma, dopo la
    # chiusura del MOT (17:30) e il quarto d'ora di ritardo dei prezzi di
    # Borsa Italiana. Non all'ora piena: lì GitHub ha più carico, e i giri
    # programmati slittano o saltano (il 21/10/2026 quello delle 17:00 non
    # è mai partito).
    - cron: "17 17 * * 1-5"
    # La riserva, un'ora e mezza dopo: se il primo giro ha già pubblicato,
    # il job `controllo` lo vede dalla data del catalogo e si ferma lì.
    - cron: "47 18 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      da_zero:
        description: "Senza il catalogo di ieri: solo il primo giro, o dopo un cambio di formato"
        type: boolean
        default: false
      onvista:
        description: "Schede onvista da leggere (vuoto: 40, come ogni giorno)"
        type: string
        default: ""
      catalogo_da_giro:
        description: "Numero di un giro passato da cui prendere il catalogo di ieri, invece che dal sito (finché GitHub ne tiene il pacchetto: un giorno)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  # Per scaricare il pacchetto di un giro passato (`catalogo_da_giro`).
  actions: read

# Un giro alla volta, e quello in corso non si interrompe: un catalogo
# scritto a metà non si pubblica.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Solo sugli orari: la riserva non rifà quello che il primo giro ha già
  # pubblicato. Il catalogo online porta la data dei prezzi, che nei giorni
  # feriali è quella di oggi, e l'ora in cui è stato generato: conta come
  # fatto solo se è di oggi e generato dalle 16:45 UTC, dopo la chiusura del
  # MOT (17:30) e il quarto d'ora di ritardo anche con l'ora solare. Un giro
  # lanciato a mano durante la seduta ha la data di oggi ma non i prezzi di
  # chiusura, e gli orari lo rifanno. Se il catalogo non si legge, si va
  # avanti.
  controllo:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      fatto: ${{ steps.data.outputs.fatto }}
    steps:
      - id: data
        env:
          TZ: Europe/Rome
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://quantotorna.it/dati/catalogo.json -o catalogo.json || exit 0
          testa=$(head -c 300 catalogo.json)
          data=$(printf '%s' "$testa" | sed -n 's/.*"data": *"\([0-9-]*\)".*/\1/p')
          generato=$(printf '%s' "$testa" | sed -n 's/.*"generato": *"\([0-9T:.Z-]*\)".*/\1/p')
          oggi=$(date +%F)
          echo "Catalogo online del ${data:-?}, generato ${generato:-?}; oggi è $oggi."
          if [ "$data" = "$oggi" ] && [[ "$generato" > "${oggi}T16:45" ]]; then
            echo "fatto=true" >> "$GITHUB_OUTPUT"
          fi

  compila:
    needs: controllo
    # Sui push e a mano `controllo` non gira, e il giro va avanti lo stesso.
    if: ${{ !cancelled() && needs.controllo.outputs.fatto != 'true' }}
    runs-on: ubuntu-latest
    env:
      # Le date dei conti sono quelle italiane (`giornoDeiPrezzi`).
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Solo sul codice nuovo: un test che dipende dalla data non deve
      # fermare il rinnovo dei dati.
      - name: Test
        if: github.event_name == 'push'
        run: npm test

      - name: Catalogo di ieri, dal sito
        if: ${{ !inputs.da_zero && !inputs.catalogo_da_giro }}
        run: |
          mkdir -p dati
          curl --fail --silent --show-error --location --retry 3 \
            https://quantotorna.it/dati/catalogo.json -o dati/catalogo.json

      # A mano, per ripartire dal catalogo di un giro passato invece che da
      # quello pubblicato: lo si prende dal pacchetto che quel giro ha
      # pubblicato, finché GitHub lo tiene. Serve quando il catalogo
      # pubblicato ha perso qualcosa (il 21/10/2026 gli scambi, che
      # Euronext non dava più).
      - name: Catalogo di ieri, da un giro passato
        if: ${{ !inputs.da_zero && inputs.catalogo_da_giro }}
        env:
          GIRO: ${{ inputs.catalogo_da_giro }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GIRO" =~ ^[0-9]+$ ]]; then echo "catalogo_da_giro: atteso il numero di un giro"; exit 1; fi
          gh run download "$GIRO" --repo "$GITHUB_REPOSITORY" --name github-pages --dir pacchetto
          tar -xf pacchetto/artifact.tar -C pacchetto ./dati/catalogo.json
          mkdir -p dati
          mv pacchetto/dati/catalogo.json dati/catalogo.json
          rm -rf pacchetto

      - name: Dati di oggi
        if: github.event_name != 'push'
        env:
          DA_ZERO: ${{ inputs.da_zero }}
          ONVISTA: ${{ inputs.onvista }}
        run: |
          argomenti=()
          if [ "$DA_ZERO" = "true" ]; then argomenti+=(--da-zero); fi
          if [ -n "$ONVISTA" ]; then argomenti+=(--onvista "$ONVISTA"); fi
          npm run scarica -- "${argomenti[@]}"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  pubblica:
    needs: compila
    # Esplicito: senza, il `controllo` saltato sui push e a mano si
    # trascinava dietro anche questo job, e dal 21/10/2026 sera non si
    # pubblicava più niente.
    if: ${{ !cancelled() && needs.compila.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - id: pubblicazione
        uses: actions/deploy-pages@v5
