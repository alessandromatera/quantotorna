# Il sito su GitHub Pages: il giro di ogni giorno feriale e ogni push su main.
#
# - Giro del giorno (lanciato da fuori, o a mano): riscarica dal sito il
#   catalogo di ieri, che è la memoria dello scaricamento (dati di emissione,
#   piani degli step-up, documenti del MEF già letti), scarica i dati di
#   oggi, compila e pubblica. Se i listini non si leggono, lo scaricamento
#   esce con 1: il sito resta quello di ieri e GitHub lo segnala per email.
#   Il rinnovo dei dati non tocca il codice e non chiede conferma.
# - Il giro del giorno lo lancia un cron esterno con l'API di GitHub
#   (`workflow_dispatch`), nei giorni feriali dopo la chiusura del MOT
#   (17:30) e il quarto d'ora di ritardo dei prezzi di Borsa Italiana. Gli
#   orari di GitHub (`schedule`) partivano con ore di ritardo o saltavano
#   (il 22 e il 23/10/2026 più di tre ore dopo, il 26/10/2026 mai); un giro
#   chiesto con l'API parte subito. Il cron guarda prima il catalogo
#   online: se è di oggi e generato dalle 16:45 UTC non chiede niente, e se
#   un giro fallisce lo richiede più tardi.
# - Titoli lasciati fuori per un motivo che ieri non c'era (un titolo nuovo
#   che il motore non sa leggere, una scheda scritta in un altro modo): lo
#   scaricamento li scrive nel riepilogo del giro, e dopo la pubblicazione il
#   job `avvisi` fallisce apposta, perché GitHub lo segnali all'autore per
#   email. Il sito è già aggiornato, e il cron guarda solo la data del
#   catalogo: non rilancia niente.
# - Push su main: test, poi ricompila col catalogo già pubblicato, senza
#   riscaricare niente.
# - Primo giro, quando il sito non c'è ancora: a mano, con «da zero». Le
#   schede onvista si leggono tutte quelle che mancano, ogni giorno.
# - A mano si può anche ripartire dal catalogo di un giro passato
#   (`catalogo_da_giro`), finché GitHub ne tiene il pacchetto.

name: sito

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      da_zero:
        description: "Senza il catalogo di ieri: solo il primo giro, o dopo un cambio di formato"
        type: boolean
        default: false
      onvista:
        description: "Schede onvista da leggere al più (vuoto: tutte quelle che mancano, come ogni giorno)"
        type: string
        default: ""
      catalogo_da_giro:
        description: "Numero di un giro passato da cui prendere il catalogo di ieri, invece che dal sito (finché GitHub ne tiene il pacchetto: un giorno)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  # Per scaricare il pacchetto di un giro passato (`catalogo_da_giro`).
  actions: read

# Un giro alla volta, e quello in corso non si interrompe: un catalogo
# scritto a metà non si pubblica.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compila:
    runs-on: ubuntu-latest
    outputs:
      # Vuoto se non si è scaricato niente (push) o senza il catalogo di ieri.
      scartate_nuove: ${{ steps.dati.outputs.scartate_nuove }}
    env:
      # Le date dei conti sono quelle italiane (`giornoDeiPrezzi`).
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Solo sul codice nuovo: un test che dipende dalla data non deve
      # fermare il rinnovo dei dati.
      - name: Test
        if: github.event_name == 'push'
        run: npm test

      - name: Catalogo di ieri, dal sito
        if: ${{ !inputs.da_zero && !inputs.catalogo_da_giro }}
        run: |
          mkdir -p dati
          curl --fail --silent --show-error --location --retry 3 \
            https://quantotorna.it/dati/catalogo.json -o dati/catalogo.json

      # A mano, per ripartire dal catalogo di un giro passato invece che da
      # quello pubblicato: lo si prende dal pacchetto che quel giro ha
      # pubblicato, finché GitHub lo tiene. Serve quando il catalogo
      # pubblicato ha perso qualcosa (il 21/10/2026 gli scambi, che
      # Euronext non dava più).
      - name: Catalogo di ieri, da un giro passato
        if: ${{ !inputs.da_zero && inputs.catalogo_da_giro }}
        env:
          GIRO: ${{ inputs.catalogo_da_giro }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GIRO" =~ ^[0-9]+$ ]]; then echo "catalogo_da_giro: atteso il numero di un giro"; exit 1; fi
          gh run download "$GIRO" --repo "$GITHUB_REPOSITORY" --name github-pages --dir pacchetto
          tar -xf pacchetto/artifact.tar -C pacchetto ./dati/catalogo.json
          mkdir -p dati
          mv pacchetto/dati/catalogo.json dati/catalogo.json
          rm -rf pacchetto

      - name: Dati di oggi
        id: dati
        if: github.event_name != 'push'
        env:
          DA_ZERO: ${{ inputs.da_zero }}
          ONVISTA: ${{ inputs.onvista }}
        run: |
          argomenti=()
          if [ "$DA_ZERO" = "true" ]; then argomenti+=(--da-zero); fi
          if [ -n "$ONVISTA" ]; then argomenti+=(--onvista "$ONVISTA"); fi
          npm run scarica -- "${argomenti[@]}"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  pubblica:
    needs: compila
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - id: pubblicazione
        uses: actions/deploy-pages@v5

  # Dopo la pubblicazione, mai prima: un avviso non deve fermare il rinnovo.
  avvisi:
    needs: [compila, pubblica]
    if: fromJSON(needs.compila.outputs.scartate_nuove || '0') > 0
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Titoli lasciati fuori per un motivo nuovo
        env:
          QUANTE: ${{ needs.compila.outputs.scartate_nuove }}
        run: |
          echo "::error::$QUANTE titoli lasciati fuori per un motivo che ieri non c'era: l'elenco è nel riepilogo del giro. Il sito è aggiornato."
          exit 1
